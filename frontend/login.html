<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Asa Branca</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-page">
    <header class="auth-header">
      <div class="brand">Asa Branca</div>
      <p>Plataforma de jogos educativos para crianças e adolescentes do ensino fundamental e médio.</p>
    </header>
    <main class="auth-container">
      <section class="auth-card">
        <h1>Entrar</h1>
        <p>Acesse o ambiente de aprendizagem e descubra jogos educativos da Asa Branca.</p>
        <form>
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="seuemail@exemplo.com" required />
          <label for="password">Senha</label>
          <input id="password" type="password" placeholder="********" required />
          <button type="submit">Entrar</button>
        </form>
        <p class="text-suggestion">
          Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
        </p>
        <p class="text-suggestion small-note">
          Para teste rápido, <a href="dashboard.html">acesse o painel</a> sem login.
        </p>
      </section>
    </main>
  </div>
</body>
</html>
