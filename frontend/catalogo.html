<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo - Asa Branca</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="side-nav">
        <div class="brand-box">Asa Branca</div>
        <nav class="nav-list">
          <a href="dashboard.html" class="nav-link">Início</a>
          <a href="catalogo.html" class="nav-link active">Catálogo</a>
          <a href="login.html" class="nav-link logout-link">Logout</a>
        </nav>
        <div class="side-footer">
          <span class="footer-label">Catálogo de jogos</span>
        </div>
      </aside>
      <div class="content-area">
        <header class="topbar">
          <div>
            <p class="small-label">Seção</p>
            <h1>Catálogo de jogos</h1>
          </div>
          <div class="user-chip">Usuário</div>
        </header>
        <main class="page-container">
          <section class="tabs-panel">
            <button class="tab active">Jogados recentemente</button>
            <button class="tab">Categorias</button>
            <button class="tab">Novidades</button>
            <button class="tab">Em breve</button>
          </section>
          <section class="catalog-list">
            <article class="card game-card">
              <div class="game-media"></div>
              <div class="game-info">
                <span class="game-tag">EduTech</span>
                <h3>EduTech Science Sertão</h3>
                <button class="pill-button">Jogar</button>
              </div>
            </article>
            <article class="card game-card">
              <div class="game-media"></div>
              <div class="game-info">
                <span class="game-tag">Cultura</span>
                <h3>Dragão do Mar - Terra da Luz</h3>
                <button class="pill-button">Jogar</button>
              </div>
            </article>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
